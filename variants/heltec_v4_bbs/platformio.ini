[env:heltec_v4_bbs_room_server]
extends = heltec_v4_oled
board_build.filesystem = littlefs
board_build.partitions = variants/heltec_v4_bbs/partitions_bbs.csv
build_flags =
  ${heltec_v4_oled.build_flags}
  -I lib/bbs_port
  -I src
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"BBS"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  ; Vuota di proposito: la BBS deve essere raggiungibile senza una password
  ; condivisa in anticipo. Un client che si connette con password vuota
  ; (il caso comune quando non se ne conosce una) ottiene automaticamente
  ; PERM_ACL_READ_WRITE (vedi onAnonDataRecv, MyMesh.cpp) — l'autenticazione
  ; vera e propria (REGISTER/LOGIN) la gestisce poi la BBS stessa, un
  ; livello sopra, indipendente da questo. Vedi UPSTREAM.md.
  -D ROOM_PASSWORD='""'
  ; Ogni utente registrato nella BBS deve anche poter restare un contatto
  ; ClientACL noto (serve il segreto condiviso per decifrare i suoi
  ; messaggi): il default upstream (20) e' pensato per un room server
  ; generico, troppo basso per BBS_MAX_USERS=500 (lib/bbs/bbs_config.h).
  ; Override locale a questo solo environment, nessuna modifica a
  ; src/helpers/ClientACL.h. Vedi UPSTREAM.md.
  -D MAX_CLIENTS=500
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/bbs_room_server>
  +<../lib/bbs/*.cpp>
  +<../lib/bbs_port/*.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  LittleFS

[env:heltec_v4_bbs_room_server_mqtt]
extends = env:heltec_v4_bbs_room_server
build_flags =
  ${env:heltec_v4_bbs_room_server.build_flags}
  -D WITH_MQTT_BRIDGE=1
  -D WITH_MQTT_WORMHOLE_BRIDGE=1
build_src_filter = ${env:heltec_v4_bbs_room_server.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/bridges/MQTTWormholeBridge.cpp>
lib_deps =
  ${env:heltec_v4_bbs_room_server.lib_deps}
  knolleary/PubSubClient @ ^2.8
